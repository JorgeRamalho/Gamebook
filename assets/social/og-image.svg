<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="GameBook  Onde cada save vira história">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12101F"/>
      <stop offset="50%" stop-color="#0A0814"/>
      <stop offset="100%" stop-color="#161425"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="45%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#9945FF"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#9945FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#FF0080" stroke-width="6"/>
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1E1A2E" stroke-width="2"/>

  <!-- Scanline hint -->
  <g opacity="0.12" aria-hidden="true">
    <rect y="80" width="1200" height="2" fill="#00D9FF"/>
    <rect y="160" width="1200" height="2" fill="#00D9FF"/>
    <rect y="240" width="1200" height="2" fill="#00D9FF"/>
    <rect y="320" width="1200" height="2" fill="#00D9FF"/>
    <rect y="400" width="1200" height="2" fill="#00D9FF"/>
    <rect y="480" width="1200" height="2" fill="#00D9FF"/>
    <rect y="560" width="1200" height="2" fill="#00D9FF"/>
  </g>

  <!-- Brand mark (scaled) -->
  <g transform="translate(120, 175) scale(4.2)">
    <rect width="64" height="64" rx="8" fill="#0A0814" stroke="#9945FF" stroke-width="2"/>
    <rect x="8" y="40" width="48" height="6" fill="#FFAA00"/>
    <rect x="10" y="34" width="20" height="8" fill="#FFE8B8"/>
    <rect x="34" y="34" width="20" height="8" fill="#FFD080"/>
    <rect x="30" y="34" width="4" height="12" fill="#9945FF"/>
    <g fill="url(#markGrad)">
      <rect x="20" y="10" width="24" height="4"/>
      <rect x="16" y="14" width="8" height="4"/><rect x="28" y="14" width="8" height="4"/><rect x="40" y="14" width="8" height="4"/>
      <rect x="12" y="18" width="40" height="4"/>
      <rect x="12" y="22" width="8" height="4"/><rect x="28" y="22" width="8" height="4"/><rect x="44" y="22" width="8" height="4"/>
      <rect x="8" y="26" width="48" height="4"/>
      <rect x="12" y="30" width="8" height="4"/><rect x="44" y="30" width="8" height="4"/>
    </g>
    <rect x="20" y="22" width="4" height="4" fill="#0A0814"/>
    <rect x="40" y="22" width="4" height="4" fill="#0A0814"/>
    <rect x="38" y="36" width="4" height="4" fill="#FF0080"/>
    <rect x="42" y="38" width="4" height="4" fill="#FF0080"/>
    <rect x="38" y="40" width="4" height="4" fill="#FF0080"/>
  </g>

  <!-- Wordmark + slogan -->
  <text x="480" y="290" font-family="Courier New, monospace" font-size="72" font-weight="700" letter-spacing="8" fill="url(#wordGrad)">GAMEBOOK</text>
  <text x="480" y="360" font-family="Courier New, monospace" font-size="28" letter-spacing="6" fill="#FFAA00">ONDE CADA SAVE VIRA HISTÓRIA</text>
  <text x="480" y="420" font-family="Courier New, monospace" font-size="22" letter-spacing="4" fill="#8A8AAA">80s · 90s · 2000s</text>
  <text x="480" y="480" font-family="Courier New, monospace" font-size="18" letter-spacing="3" fill="#66FF33">PLAYER 1: JORGE</text>
</svg>
