<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" role="img" aria-label="GameBook">
  <defs>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#9945FF"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE8B8"/>
      <stop offset="100%" stop-color="#FFAA00"/>
    </linearGradient>
  </defs>

  <!-- Mark (mini mascot) -->
  <g transform="translate(4, 10) scale(1.2)">
    <rect width="64" height="64" rx="8" fill="#12101F" stroke="#00D9FF" stroke-width="2"/>
    <rect x="8" y="40" width="48" height="6" fill="#FFAA00"/>
    <rect x="10" y="34" width="20" height="8" fill="#FFE8B8"/>
    <rect x="34" y="34" width="20" height="8" fill="#FFD080"/>
    <rect x="30" y="34" width="4" height="12" fill="#9945FF"/>
    <g fill="#00D9FF">
      <rect x="20" y="10" width="24" height="4"/>
      <rect x="16" y="14" width="8" height="4"/><rect x="28" y="14" width="8" height="4"/><rect x="40" y="14" width="8" height="4"/>
      <rect x="12" y="18" width="40" height="4"/>
      <rect x="12" y="22" width="8" height="4"/><rect x="28" y="22" width="8" height="4"/><rect x="44" y="22" width="8" height="4"/>
      <rect x="8" y="26" width="48" height="4"/>
      <rect x="12" y="30" width="8" height="4"/><rect x="44" y="30" width="8" height="4"/>
    </g>
    <rect x="20" y="22" width="4" height="4" fill="#12101F"/>
    <rect x="40" y="22" width="4" height="4" fill="#12101F"/>
  </g>

  <!-- Wordmark GAMEBOOK -->
  <text x="100" y="44" font-family="'Press Start 2P', monospace" font-size="22" fill="url(#wordGrad)" letter-spacing="2">GAME</text>
  <text x="100" y="78" font-family="'Press Start 2P', monospace" font-size="22" fill="#FFAA00" letter-spacing="2">BOOK</text>

  <!-- Pixel accent line -->
  <rect x="100" y="86" width="300" height="3" fill="#FF0080" opacity="0.8"/>
  <rect x="100" y="86" width="120" height="3" fill="#00D9FF"/>
</svg>
